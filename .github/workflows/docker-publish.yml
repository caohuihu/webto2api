name: Docker Build & Push (GHCR)

# 自动构建并推送项目镜像到 GitHub Container Registry (ghcr.io)。
# 触发方式：
#   - 每次推送到 main 分支自动构建（自动推送）
#   - Actions 页面手动触发 (workflow_dispatch)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: '构建原因'
        required: false
        default: 'Manual build update'

env:
  REGISTRY: ghcr.io
  # GHCR 镜像名必须全小写；仓库 caohuihu/webto2api 已满足。
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 QEMU (支持多架构构建, 如 ARM64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 GitHub Container Registry
      #    使用 Actions 内置 GITHUB_TOKEN (需 packages: write 权限, 见上方 permissions)
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 生成 Docker 标签:
      #    - main 分支额外打 'latest'
      #    - 总是打 'sha-xxxxxxx' (短 commit hash), 便于可复现部署
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      # 6. 构建并推送到 ghcr.io
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 同时构建 PC (amd64) 和 Mac/树莓派 (arm64) 版本
          platforms: linux/amd64,linux/arm64

      # 7. 打印本次推送的标签, 方便部署时引用
      - name: Show pushed tags
        run: echo "${{ steps.meta.outputs.tags }}"
